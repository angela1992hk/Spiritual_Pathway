<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discover Your Spiritual Pathway</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #1F5C8B;
    --blue-light: #D6E8F7;
    --gold: #C8892A;
    --gold-light: #FFF3DC;
    --purple: #7B3F6E;
    --purple-light: #F7E8F0;
    --bg: #F8F6F2;
    --card: #FFFFFF;
    --text: #1A1A1A;
    --muted: #777;
    --border: #E0D9CF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .hero {
    background: var(--blue);
    padding: 64px 24px 56px;
    text-align: center;
    position: relative;
  }
  .hero h1 {
    font-family: 'Playfair Display', serif;
    color: #fff;
    margin-bottom: 14px;
  }
  .hero p {
    font-size: 15px;
    color: rgba(255,255,255,0.65);
    margin: 0 auto 28px;
  }
  .questions-wrap {
    max-width: 660px;
    margin: 0 auto;
    padding: 28px 24px 40px;
  }
  .question-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 14px;
  }
  .q-text {
    font-size: 16px;
    line-height: 1.55;
    color: var(--text);
    margin-bottom: 18px;
    font-family: 'Playfair Display', serif;
  }
  .score-row {
    display: flex;
    gap: 8px;
  }
  .score-btn {
    flex: 1;
    height: 44px;
    border: 2px solid var(--border);
    background: transparent;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .score-btn:hover {
    border-color: var(--blue);
    background: var(--blue-light);
  }
  .score-btn.selected {
    background: var(--blue);
    border-color: var(--blue);
    color: #fff;
  }
  .submit-wrap {
    max-width: 660px;
    margin: 0 auto;
    padding: 0 24px 60px;
    text-align: center;
  }
  .submit-btn {
    background: var(--blue);
    color: #fff;
    border: none;
    padding: 16px 48px;
    border-radius: 50px;
    font-size: 16px;
    cursor: pointer;
    opacity: 0.4;
    pointer-events: none;
  }
  .submit-btn.ready {
    opacity: 1;
    pointer-events: all;
  }
  .results-wrap {
    display: none;
    max-width: 660px;
    margin: 0 auto;
    padding: 28px 24px 60px;
  }
  .results-wrap.show { display: block; }
  .winner-card {
    background: var(--blue);
    border-radius: 20px;
    padding: 32px 28px;
    color: #fff;
    text-align: center;
    margin-bottom: 24px;
  }
  .winner-name {
    font-family: 'Playfair Display', serif;
    font-size: 36px;
    color: #fff;
    margin: 10px 0;
  }
  .retry-btn {
    display: block;
    margin: 28px auto 0;
    background: transparent;
    border: 2px solid var(--blue);
    color: var(--blue);
    padding: 12px 36px;
    border-radius: 50px;
    font-size: 14px;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="hero">
  <div style="font-size: 11px; font-weight: 500; letter-spacing: 3px; text-transform: uppercase; color: rgba(255,255,255,0.5); margin-bottom: 16px;">Sacred Pathways · Gary Thomas</div>
  <h1>Discover Your<br>Spiritual Pathway</h1>
  <p>How did God wire you to connect with Him?<br>27 honest questions. No right answers.</p>
  <div class="scale-legend">
    <div><strong>1</strong> = Not true at all</div>
    <div><strong>3</strong> = Somewhat true</div>
    <div><strong>5</strong> = Very true</div>
  </div>
</div>

<div class="progress-bar-wrap">
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-label" id="progressLabel">0 of 27 answered</div>
</div>

<div class="questions-wrap" id="questionsWrap"></div>

<div class="submit-wrap" id="submitWrap">
  <button class="submit-btn" id="submitBtn" onclick="showResults()">See My Results</button>
</div>

<div class="results-wrap" id="resultsWrap"></div>

<script>
const questions = [
  {n:1, p:"Naturalists", text:"I feel closest to God when I am outside - in the mountains, forests, or by the ocean."},
  {n:2, p:"Enthusiasts", text:"I feel closest to God when I am celebrating Him with energy and joy."},
  {n:3, p:"Traditionalists", text:"I feel closest to God through familiar rituals, symbols, and traditions."},
  {n:4, p:"Activists", text:"I feel closest to God when I am standing up for what is right."},
  {n:5, p:"Ascetics", text:"I feel closest to God when everything is stripped away - silence and simplicity."},
  {n:6, p:"Sensates", text:"I feel closest to God in worship that is rich and beautiful."},
  {n:7, p:"Intellectuals", text:"I feel closest to God when I learn something new about Him."},
  {n:8, p:"Caregivers", text:"I feel closest to God when I am helping someone in need."},
  {n:9, p:"Contemplatives", text:"I feel closest to God when I am alone and quiet."},
  {n:10, p:"Enthusiasts", text:"I believe God is exciting and I expect Him to show up."},
  {n:11, p:"Naturalists", text:"Being stuck indoors makes me feel distant from God."},
  {n:12, p:"Caregivers", text:"I see God in the faces of people who are hurting."},
  {n:13, p:"Intellectuals", text:"I get frustrated when church is all feelings and emotion."},
  {n:14, p:"Ascetics", text:"Fasting and solitude feel natural to draw near to God."},
  {n:15, p:"Sensates", text:"I find it hard to worship in a plain or empty space."},
  {n:16, p:"Activists", text:"I get frustrated when Christians do nothing about suffering."},
  {n:17, p:"Traditionalists", text:"Structure and rhythm in worship help me go deeper."},
  {n:18, p:"Contemplatives", text:"Hard times are when I cannot feel God's love."},
  {n:19, p:"Contemplatives", text:"I love spending time with God - just being with Him."},
  {n:20, p:"Traditionalists", text:"I value the history and traditions of Christian faith."},
  {n:21, p:"Enthusiasts", text:"I find it confusing when Christians seem cold in worship."},
  {n:22, p:"Naturalists", text:"The beauty of nature moves my heart toward God."},
  {n:23, p:"Caregivers", text:"I get restless when not doing something practical to help."},
  {n:24, p:"Ascetics", text:"I am more drawn to a quiet, simple faith."},
  {n:25, p:"Sensates", text:"Candles, incense, or music help me focus on God."},
  {n:26, p:"Activists", text:"Taking action for God's kingdom feels natural to me."},
  {n:27, p:"Intellectuals", text:"I love reading, studying, and thinking deeply about faith."}
];

const pathways = [
  { name:"Naturalists", desc:"You encounter God through creation and outdoors." },
  { name:"Sensates", desc:"You encounter God through beauty, art, and senses." },
  { name:"Enthusiasts", desc:"You encounter God through celebration and joy." },
  { name:"Intellectuals", desc:"You encounter God when your mind is awakened." },
  { name:"Traditionalists", desc:"You encounter God through ritual and sacred rhythms." },
  { name:"Caregivers", desc:"You encounter God through loving and serving others." },
  { name:"Activists", desc:"You encounter God through action and justice." },
  { name:"Contemplatives", desc:"You encounter God through adoration and stillness." },
  { name:"Ascetics", desc:"You encounter God in solitude and simplicity." }
];

const scores = {};
questions.forEach(q => { if (!scores[q.p]) scores[q.p] = 0; });

const wrap = document.getElementById('questionsWrap');
questions.forEach((q, i) => {
  const card = document.createElement('div');
  card.className = 'question-card';
  card.id = 'card-' + q.n;
  let btns = '';
  for(let v=1; v<=5; v++) {
    btns += '<button class="score-btn" data-q="' + q.n + '" onclick="select(' + q.n + ', ' + v + ', \'' + q.p + '\')">' + v + '</button>';
  }
  card.innerHTML = '<div class="q-text">Q' + q.n + ': ' + q.text + '</div><div class="score-row">' + btns + '</div>';
  wrap.appendChild(card);
});

function select(qn, val, pathway) {
  document.querySelectorAll('[data-q="' + qn + '"]').forEach(btn => {
    btn.classList.remove('selected');
  });
  event.target.classList.add('selected');
  scores[pathway] = (scores[pathway] || 0) + val;
}

function showResults() {
  const sorted = pathways.sort((a, b) => (scores[b.name] || 0) - (scores[a.name] || 0));
  const winner = sorted[0];
  
  document.getElementById('questionsWrap').style.display = 'none';
  document.getElementById('submitWrap').style.display = 'none';
  
  const rw = document.getElementById('resultsWrap');
  rw.classList.add('show');
  rw.innerHTML = '<div class="winner-card"><div class="winner-name">' + winner.name + '</div><p>' + winner.desc + '</p></div><button class="retry-btn" onclick="location.reload()">Start Again</button>';
}
</script>
</body>
</html>
