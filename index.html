<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discover Your Spiritual Pathway</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --blue:       #1F5C8B;
    --blue-light: #D6E8F7;
    --gold:       #C8892A;
    --gold-light: #FFF3DC;
    --bg:         #F8F6F2;
    --card:       #FFFFFF;
    --text:       #1A1A1A;
    --muted:      #777;
    --border:     #E0D9CF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .hero { background: var(--blue); padding: 64px 24px 56px; text-align: center; position: relative; overflow: hidden; }
  .hero h1 { font-family: 'Playfair Display', serif; font-size: clamp(32px, 6vw, 52px); color: #fff; margin-bottom: 14px; }
  .hero p { font-size: 15px; color: rgba(255,255,255,0.65); max-width: 480px; margin: 0 auto 28px; line-height: 1.6; font-style: italic; }
  .scale-legend { display: inline-block; background: rgba(255,255,255,0.1); border-radius: 40px; padding: 10px 20px; text-align: center; line-height: 1.8; }
  .scale-legend div { font-size: 13px; color: white; margin: 4px 0; }
  .scale-legend strong { color: #fff; font-size: 14px; }
  .progress-bar-wrap { max-width: 660px; margin: 0 auto; padding: 20px 24px 0; }
  .progress-track { height: 4px; background: var(--border); border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--gold); border-radius: 4px; transition: width 0.4s ease; width: 0%; }
  .progress-label { font-size: 12px; color: var(--muted); text-align: right; margin-top: 6px; }
  .questions-wrap { max-width: 660px; margin: 0 auto; padding: 28px 24px 40px; }
  .question-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; margin-bottom: 14px; animation: fadeUp 0.35s forwards; opacity: 0; transform: translateY(16px); }
  @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
  .q-text { font-size: 16px; line-height: 1.55; color: var(--text); margin-bottom: 18px; font-family: 'Playfair Display', serif; }
  .score-row { display: flex; gap: 8px; }
  .score-btn { flex: 1; height: 44px; border: 2px solid var(--border); background: transparent; border-radius: 10px; font-size: 16px; cursor: pointer; transition: all 0.15s ease; }
  .score-btn:hover { border-color: var(--blue); background: var(--blue-light); }
  .score-btn.selected { background: var(--blue); border-color: var(--blue); color: #fff; }
  .submit-wrap { max-width: 660px; margin: 0 auto; padding: 0 24px 60px; text-align: center; }
  .submit-btn { background: var(--blue); color: #fff; border: none; padding: 16px 48px; border-radius: 50px; font-size: 16px; cursor: pointer; opacity: 0.4; pointer-events: none; }
  .submit-btn.ready { opacity: 1; pointer-events: all; }
  .results-wrap { display: none; max-width: 660px; margin: 0 auto; padding: 28px 24px 60px; }
  .results-wrap.show { display: block; }
  .results-title { font-family: 'Playfair Display', serif; font-size: 28px; color: var(--blue); text-align: center; margin-bottom: 6px; }
  .winner-card { background: var(--blue); border-radius: 20px; padding: 32px 28px; color: #fff; text-align: center; margin-bottom: 24px; }
  .winner-name { font-family: 'Playfair Display', serif; font-size: 36px; color: #fff; margin: 10px 0; }
  .winner-desc { font-size: 15px; color: rgba(255,255,255,0.75); line-height: 1.6; }
  .score-result-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .score-result-name { font-size: 14px; font-weight: 500; min-width: 130px; }
  .score-result-bar-wrap { flex: 1; height: 10px; background: var(--border); border-radius: 10px; overflow: hidden; }
  .score-result-bar { height: 100%; border-radius: 10px; transition: width 0.8s cubic-bezier(.16,1,.3,1); width: 0%; }
  .button-group { display: flex; gap: 12px; justify-content: center; margin: 24px 0; flex-wrap: wrap; }
  .retry-btn { background: transparent; border: 2px solid var(--blue); color: var(--blue); padding: 12px 24px; border-radius: 50px; font-size: 14px; cursor: pointer; margin: 8px; transition: all 0.2s; }
  .retry-btn:hover { background: var(--blue); color: #fff; }
  @media (max-width: 480px) { .button-group { flex-direction: column; } .retry-btn { width: calc(100% - 16px); } }
</style>
</head>
<body>
<div class="hero">
  <div style="font-size: 11px; text-transform: uppercase; color: rgba(255,255,255,0.5); margin-bottom: 16px;">Sacred Pathways · Gary Thomas</div>
  <h1>Discover Your Spiritual Pathway</h1>
  <p>How did God wire you to connect with Him?<br>27 honest questions. No right answers.</p>
  <div class="scale-legend">
    <div><strong>1</strong> = Not true at all</div>
    <div><strong>3</strong> = Somewhat true</div>
    <div><strong>5</strong> = Very true</div>
  </div>
</div>
<div class="progress-bar-wrap">
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-label" id="progressLabel">0 of 27 answered</div>
</div>
<div class="questions-wrap" id="questionsWrap"></div>
<div class="submit-wrap" id="submitWrap">
  <button class="submit-btn" id="submitBtn" onclick="showResults()">See My Results</button>
  <p style="font-size: 13px; color: var(--muted); margin-top: 10px; font-style: italic;">Answer all 27 to unlock your results</p>
</div>
<div class="results-wrap" id="resultsWrap"></div>

<script>
const questions = [
  {n:1, p:"Naturalists", text:"I feel closest to God when I am outside in the mountains, forests, or by the ocean."},
  {n:2, p:"Enthusiasts", text:"I feel closest to God when I am celebrating Him with energy and joy."},
  {n:3, p:"Traditionalists", text:"I feel closest to God through familiar rituals, symbols, and traditions."},
  {n:4, p:"Activists", text:"I feel closest to God when I am standing up for what is right."},
  {n:5, p:"Ascetics", text:"I feel closest to God when everything is stripped away - silence and simplicity."},
  {n:6, p:"Sensates", text:"I feel closest to God in worship that is rich and beautiful."},
  {n:7, p:"Intellectuals", text:"I feel closest to God when I learn something new about Him."},
  {n:8, p:"Caregivers", text:"I feel closest to God when I am helping someone in need."},
  {n:9, p:"Contemplatives", text:"I feel closest to God when I am alone and quiet."},
  {n:10, p:"Enthusiasts", text:"I believe God is exciting and I expect Him to show up."},
  {n:11, p:"Naturalists", text:"Being stuck indoors makes me feel distant from God."},
  {n:12, p:"Caregivers", text:"I see God in the faces of people who are hurting."},
  {n:13, p:"Intellectuals", text:"I get frustrated when church is all feelings and emotion."},
  {n:14, p:"Ascetics", text:"Fasting and solitude feel natural to draw near to God."},
  {n:15, p:"Sensates", text:"I find it hard to worship in a plain or empty space."},
  {n:16, p:"Activists", text:"I get frustrated when Christians do nothing about suffering."},
  {n:17, p:"Traditionalists", text:"Structure and rhythm in worship help me go deeper."},
  {n:18, p:"Contemplatives", text:"Hard times are when I cannot feel God's love."},
  {n:19, p:"Contemplatives", text:"I love spending time with God just being with Him."},
  {n:20, p:"Traditionalists", text:"I value the history and traditions of Christian faith."},
  {n:21, p:"Enthusiasts", text:"I find it confusing when Christians seem cold in worship."},
  {n:22, p:"Naturalists", text:"The beauty of nature moves my heart toward God."},
  {n:23, p:"Caregivers", text:"I get restless when not doing something practical to help."},
  {n:24, p:"Ascetics", text:"I am more drawn to a quiet, simple faith."},
  {n:25, p:"Sensates", text:"Candles, incense, or music help me focus on God."},
  {n:26, p:"Activists", text:"Taking action for God's kingdom feels natural to me."},
  {n:27, p:"Intellectuals", text:"I love reading, studying, and thinking deeply about faith."}
];

const pathways = [
  { name:"Naturalists", color:"#1F5C8B", desc:"You encounter God most powerfully through creation and the outdoors." },
  { name:"Sensates", color:"#1F5C8B", desc:"You encounter God through beauty, art, and the senses." },
  { name:"Enthusiasts", color:"#1F5C8B", desc:"You encounter God through celebration, joy, and expectancy." },
  { name:"Intellectuals", color:"#1E6B3C", desc:"You encounter God when your mind is awakened." },
  { name:"Traditionalists", color:"#1E6B3C", desc:"You encounter God through ritual and sacred rhythms." },
  { name:"Caregivers", color:"#7B3F6E", desc:"You encounter God by loving and serving others." },
  { name:"Activists", color:"#7B3F6E", desc:"You encounter God through action and justice." },
  { name:"Contemplatives", color:"#C8892A", desc:"You encounter God through adoration and stillness." },
  { name:"Ascetics", color:"#C8892A", desc:"You encounter God in solitude and simplicity." }
];

const scores = {};
questions.forEach(q => { if (!scores[q.p]) scores[q.p] = {}; scores[q.p][q.n] = 0; });

const wrap = document.getElementById('questionsWrap');
questions.forEach((q, i) => {
  const card = document.createElement('div');
  card.className = 'question-card';
  card.style.animationDelay = i * 0.04 + 's';
  let btns = '';
  for(let v=1; v<=5; v++) btns += '<button class="score-btn" data-q="' + q.n + '" onclick="select(' + q.n + ', ' + v + ', \\'' + q.p + '\\')">' + v + '</button>';
  card.innerHTML = '<div class="q-text">Q' + q.n + ': ' + q.text + '</div><div class="score-row">' + btns + '</div>';
  wrap.appendChild(card);
});

function select(qn, val, pathway) {
  document.querySelectorAll('[data-q="' + qn + '"]').forEach(btn => btn.classList.toggle('selected', false));
  event.target.classList.add('selected');
  scores[pathway][qn] = val;
  updateProgress();
}

function updateProgress() {
  let answered = 0;
  questions.forEach(q => { if (scores[q.p][q.n] > 0) answered++; });
  document.getElementById('progressFill').style.width = (answered / 27 * 100) + '%';
  document.getElementById('progressLabel').textContent = answered + ' of 27 answered';
  if (answered === 27) document.getElementById('submitBtn').classList.add('ready');
}

function showResults() {
  const totals = {};
  pathways.forEach(p => {
    totals[p.name] = Object.values(scores[p.name]).reduce((a, b) => a + b, 0);
  });
  const sorted = [...pathways].sort((a, b) => totals[b.name] - totals[a.name]);
  const winner = sorted[0];

  document.getElementById('questionsWrap').style.display = 'none';
  document.getElementById('submitWrap').style.display = 'none';
  const rw = document.getElementById('resultsWrap');
  rw.classList.add('show');
  
  rw.innerHTML = '<div class="results-title">Your Spiritual Pathway: ' + winner.name + '</div><div class="winner-card"><div class="winner-desc">' + winner.desc + '</div></div><div style="font-size:13px;font-weight:500;text-transform:uppercase;margin:20px 0;color:var(--muted);">All Scores</div><div id="scoreRows"></div><div class="button-group"><button class="retry-btn" onclick="shareResults()">Share Results</button><button class="retry-btn" onclick="saveResults()">Save Results</button><button class="retry-btn" onclick="location.reload()">Start Again</button></div>';

  const rowsWrap = document.getElementById('scoreRows');
  sorted.forEach((p, i) => {
    const score = totals[p.name];
    const row = document.createElement('div');
    row.className = 'score-result-row';
    row.innerHTML = '<div class="score-result-name">' + p.name + '</div><div class="score-result-bar-wrap"><div class="score-result-bar" id="bar-' + i + '" style="background:' + p.color + '"></div></div><div style="min-width:30px;text-align:right;">' + score + '</div>';
    rowsWrap.appendChild(row);
    setTimeout(() => {
      document.getElementById('bar-' + i).style.width = (score / 15 * 100) + '%';
    }, 100 + i * 80);
  });
}

function shareResults() {
  const totals = {};
  pathways.forEach(p => {
    totals[p.name] = Object.values(scores[p.name]).reduce((a, b) => a + b, 0);
  });
  const sorted = [...pathways].sort((a, b) => totals[b.name] - totals[a.name]);
  const text = 'I discovered my Spiritual Pathway: ' + sorted[0].name + '! ' + sorted[0].desc + ' Take the assessment: https://angela1992hk.github.io/Spiritual_Pathway';
  if (navigator.share) {
    navigator.share({ title: 'My Spiritual Pathway', text: text });
  } else {
    alert('Copy to share: ' + text);
  }
}

function saveResults() {
  const totals = {};
  pathways.forEach(p => {
    totals[p.name] = Object.values(scores[p.name]).reduce((a, b) => a + b, 0);
  });
  const sorted = [...pathways].sort((a, b) => totals[b.name] - totals[a.name]);
  let content = 'SPIRITUAL PATHWAY RESULTS\n===========================\n\nPrimary: ' + sorted[0].name + '\n\n';
  sorted.forEach(p => { content += p.name + ': ' + totals[p.name] + '\n'; });
  const el = document.createElement('a');
  el.href = 'data:text/plain,' + encodeURIComponent(content);
  el.download = 'spiritual-pathway.txt';
  el.click();
}
</script>
</body>
</html>
