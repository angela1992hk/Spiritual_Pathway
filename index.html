<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiritual Pathway Assessment</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=DM+Sans&display=swap" rel="stylesheet">
    <style>
        body { font-family: DM Sans; background: #f5f5f5; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #1F5C8B; }
        .container { max-width: 700px; margin: 0 auto; }
        .question { background: white; padding: 20px; margin: 15px 0; border-radius: 8px; border-left: 4px solid #1F5C8B; }
        .question p { margin: 0 0 15px 0; font-size: 16px; }
        input[type="range"] { width: 100%; }
        button { background: #1F5C8B; color: white; padding: 12px 30px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background: #154a6b; }
        #results { display: none; background: white; padding: 20px; margin: 20px 0; border-radius: 8px; }
        .score-bar { background: #e0e0e0; height: 20px; border-radius: 5px; margin: 10px 0; overflow: hidden; }
        .score-fill { background: #1F5C8B; height: 100%; transition: width 0.3s; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Spiritual Pathway Assessment</h1>
        <div id="questions"></div>
        <button onclick="submitAssessment()">See My Results</button>
        <div id="results"></div>
        <div id="buttons" style="display:none;">
            <button onclick="shareResults()">Share Results</button>
            <button onclick="saveResults()">Save Results</button>
            <button onclick="location.reload()">Start Again</button>
        </div>
    </div>

    <script>
        const questions = [
            { id: 1, pathway: "Naturalists", text: "I feel closest to God when I am outside — in the mountains, forests, or by the ocean." },
            { id: 2, pathway: "Enthusiasts", text: "I feel closest to God when I am celebrating Him with energy and joy." },
            { id: 3, pathway: "Traditionalists", text: "I feel closest to God through familiar rituals, symbols, and traditions." },
            { id: 4, pathway: "Activists", text: "I feel closest to God when I am standing up for what is right." },
            { id: 5, pathway: "Ascetics", text: "I feel closest to God when everything is stripped away — silence and simplicity." },
            { id: 6, pathway: "Sensates", text: "I feel closest to God in worship that is rich and beautiful." },
            { id: 7, pathway: "Intellectuals", text: "I feel closest to God when I learn something new about Him." },
            { id: 8, pathway: "Caregivers", text: "I feel closest to God when I am helping someone in need." },
            { id: 9, pathway: "Contemplatives", text: "I feel closest to God when I am alone and quiet." },
            { id: 10, pathway: "Enthusiasts", text: "I believe God is exciting and I expect Him to show up." },
            { id: 11, pathway: "Naturalists", text: "Being stuck indoors makes me feel distant from God." },
            { id: 12, pathway: "Caregivers", text: "I see God in the faces of people who are hurting." },
            { id: 13, pathway: "Intellectuals", text: "I get frustrated when church is all feelings and emotion." },
            { id: 14, pathway: "Ascetics", text: "Fasting and solitude feel natural to draw near to God." },
            { id: 15, pathway: "Sensates", text: "I find it hard to worship in a plain or empty space." },
            { id: 16, pathway: "Activists", text: "I get frustrated when Christians do nothing about suffering." },
            { id: 17, pathway: "Traditionalists", text: "Structure and rhythm in worship help me go deeper." },
            { id: 18, pathway: "Contemplatives", text: "Hard times are when I cannot feel God's love." },
            { id: 19, pathway: "Contemplatives", text: "I love spending time with God just being with Him." },
            { id: 20, pathway: "Traditionalists", text: "I value the history and traditions of Christian faith." },
            { id: 21, pathway: "Enthusiasts", text: "I find it confusing when Christians seem cold in worship." },
            { id: 22, pathway: "Naturalists", text: "The beauty of nature moves my heart toward God." },
            { id: 23, pathway: "Caregivers", text: "I get restless when not doing something practical to help." },
            { id: 24, pathway: "Ascetics", text: "I am more drawn to a quiet, simple faith." },
            { id: 25, pathway: "Sensates", text: "Candles, incense, or music help me focus on God." },
            { id: 26, pathway: "Activists", text: "Taking action for God's kingdom feels natural to me." },
            { id: 27, pathway: "Intellectuals", text: "I love reading, studying, and thinking deeply about faith." }
        ];

        const pathways = {
            "Naturalists": "You encounter God most powerfully through creation and the outdoors.",
            "Sensates": "You encounter God through beauty, art, and the senses.",
            "Enthusiasts": "You encounter God through celebration, joy, and expectancy.",
            "Intellectuals": "You encounter God when your mind is awakened.",
            "Traditionalists": "You encounter God through ritual and sacred rhythms.",
            "Caregivers": "You encounter God by loving and serving others.",
            "Activists": "You encounter God through action and justice.",
            "Contemplatives": "You encounter God through adoration and stillness.",
            "Ascetics": "You encounter God in solitude and simplicity."
        };

        let scores = {};
        Object.keys(pathways).forEach(p => scores[p] = 0);

        // Render questions
        const container = document.getElementById('questions');
        questions.forEach(q => {
            const div = document.createElement('div');
            div.className = 'question';
            div.innerHTML = `
                <p><strong>Q${q.id}:</strong> ${q.text}</p>
                <label>Not true (1)<input type="range" min="1" max="5" value="3" data-pathway="${q.pathway}" onchange="updateScore(this)">Very true (5)</label>
            `;
            container.appendChild(div);
        });

        function updateScore(slider) {
            const pathway = slider.dataset.pathway;
            scores[pathway] += parseInt(slider.value);
        }

        function submitAssessment() {
            // Reset and recalculate
            Object.keys(scores).forEach(p => scores[p] = 0);
            document.querySelectorAll('input[type="range"]').forEach(slider => {
                const pathway = slider.dataset.pathway;
                scores[pathway] += parseInt(slider.value);
            });

            // Find top pathway
            const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
            const winner = sorted[0][0];

            // Show results
            let html = '<h2>Your Spiritual Pathway: <strong>' + winner + '</strong></h2>';
            html += '<p>' + pathways[winner] + '</p>';
            html += '<h3>All Scores:</h3>';
            sorted.forEach(([name, score]) => {
                const pct = (score / 135) * 100;
                html += '<div><strong>' + name + ':</strong> ' + score + '<div class="score-bar"><div class="score-fill" style="width:' + pct + '%"></div></div></div>';
            });

            document.getElementById('results').style.display = 'block';
            document.getElementById('results').innerHTML = html;
            document.getElementById('buttons').style.display = 'block';
            document.getElementById('questions').style.display = 'none';
            document.querySelectorAll('button')[0].style.display = 'none';
        }

        function shareResults() {
            const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
            const text = "I'm a " + sorted[0][0] + "! " + pathways[sorted[0][0]] + " https://angela1992hk.github.io/Spiritual_Pathway";
            if (navigator.share) {
                navigator.share({ title: "My Spiritual Pathway", text: text });
            } else {
                alert("Copy to share:\n\n" + text);
            }
        }

        function saveResults() {
            const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
            let content = "SPIRITUAL PATHWAY RESULTS\n\n";
            content += "Primary: " + sorted[0][0] + "\n";
            content += pathways[sorted[0][0]] + "\n\n";
            content += "All Scores:\n";
            sorted.forEach(([name, score]) => {
                content += name + ": " + score + "\n";
            });

            const el = document.createElement('a');
            el.href = 'data:text/plain,' + encodeURIComponent(content);
            el.download = 'spiritual-pathway.txt';
            el.click();
        }
    </script>
</body>
</html>
